packages:
  - "apps/*"
  - "packages/*"
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
ignoredBuiltDependencies:
  - canvas
allowBuilds:
  # `canvas` is an optionalDependency of pdfjs-dist that we never use --
  # rendering goes through @napi-rs/canvas (prebuilt) instead. Its node-gyp
  # build fails on Windows without cairo headers, so skip it rather than spend
  # every install on a build that cannot succeed. See
  # apps/worker/src/pdfPolyfills.ts, which supplies the DOMMatrix/Path2D
  # globals pdf.js would otherwise take from canvas.
  canvas: false
  esbuild: true
  sharp: true
  unrs-resolver: true
